version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/ui-tests"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    # Prefer bumping the lockfile alone and only widen a range in package.json when a version falls outside it.
    versioning-strategy: "increase-if-necessary"
    groups:
      npm:
        applies-to: version-updates
        patterns:
          - "*"
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
    cooldown:
      default-days: 7
