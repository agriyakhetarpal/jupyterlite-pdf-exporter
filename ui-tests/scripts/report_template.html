<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PDF export report</title>
    <script>
      (function () {
        var theme;
        try {
          theme = window.localStorage.getItem('theme');
        } catch (e) {
          theme = null;
        }
        if (theme !== 'dark-mode' && theme !== 'light-mode')
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark-mode'
            : 'light-mode';
        document.documentElement.classList.add(theme);
      })();
    </script>
    <style>
      $styles
    </style>
  </head>
  <body>
    <div id="root">
      <div class="htmlreport vbox px-4 pb-4">
        <main>
          <div class="pt-3">
            <div class="header-view-status-container ml-2 pl-2 d-flex">
              $nav
            </div>
            <form class="subnav-search" id="search-form">
              $search_icon
              <input
                name="q"
                id="search-input"
                spellcheck="false"
                class="form-control subnav-search-input input-contrast"
                aria-label="Search tests"
                placeholder="Search tests"
              />
            </form>
          </div>
          <div class="header-view">
            <div class="hbox header-superheader">
              <div class="test-file-header-info">
                <div id="filtered-stats" hidden></div>
                $notice
              </div>
              <div style="flex: auto"></div>
              <div id="started-at" style="margin-right: 10px" data-iso="$started_at_iso">
                $started_at
              </div>
              <div>Total time: $total_time</div>
            </div>
          </div>
          $content
        </main>
      </div>
    </div>
    <dialog id="settings-dialog">
      <label class="header-setting-theme">
        Theme:
        <select id="theme-select">
          <option value="dark-mode">Dark mode</option>
          <option value="light-mode">Light mode</option>
          <option value="system">System</option>
        </select>
      </label>
    </dialog>
    <script>
      $script
    </script>
  </body>
</html>
