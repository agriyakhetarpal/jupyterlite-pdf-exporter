<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PDF export report</title>
    <script>
      (function () {
        var theme;
        try {
          theme = window.localStorage.getItem('theme');
        } catch (e) {
          theme = null;
        }
        if (theme !== 'dark-mode' && theme !== 'light-mode')
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark-mode'
            : 'light-mode';
        document.documentElement.classList.add(theme);
      })();
    </script>
    <style>
      $styles
    </style>
  </head>
  <body>
    <div id="root">
      <div class="htmlreport vbox px-4 pb-4">
        <main>
          <div class="pt-3">
            <div class="header-view-status-container ml-2 pl-2 d-flex">
              $nav
            </div>
            <form class="subnav-search" id="search-form">
              $search_icon
              <input
                name="q"
                id="search-input"
                spellcheck="false"
                class="form-control subnav-search-input input-contrast"
                aria-label="Search tests"
                placeholder="Search tests"
              />
            </form>
          </div>
          <div class="header-view">
            <div class="hbox header-superheader">
              <div class="test-file-header-info">
                <div id="filtered-stats" hidden></div>
                $notice
              </div>
              <div style="flex: auto"></div>
              <div
                id="started-at"
                style="margin-right: 10px"
                data-iso="$started_at_iso"
              >
                $started_at
              </div>
              <div>Total time: $total_time</div>
            </div>
          </div>
          $content
        </main>
      </div>
      <dialog id="settings-dialog">
        <label class="header-setting-theme">
          Theme:
          <select id="theme-select">
            <option value="dark-mode">Dark mode</option>
            <option value="light-mode">Light mode</option>
            <option value="system">System</option>
          </select>
        </label>
      </dialog>
      <dialog id="lightbox" aria-labelledby="lightbox-title">
        <div class="lightbox-header">
          <span id="lightbox-title" class="lightbox-title"></span>
          <span id="lightbox-subtitle" class="lightbox-subtitle"></span>
          <div id="lightbox-modes" class="lightbox-modes" role="tablist" hidden>
            <button type="button" role="tab" data-mode="expected">
              Expected
            </button>
            <button type="button" role="tab" data-mode="actual">Actual</button>
            <button type="button" role="tab" data-mode="diff">Diff</button>
            <button type="button" role="tab" data-mode="slider">Slider</button>
            <button type="button" role="tab" data-mode="onion">
              Onion skin
            </button>
          </div>
          <div id="lightbox-pager" class="lightbox-pager" hidden>
            <button
              type="button"
              id="lightbox-prev"
              aria-label="Previous page"
              title="Previous page"
            >
              <svg
                aria-hidden="true"
                viewBox="0 0 16 16"
                width="16"
                height="16"
              >
                <path
                  fill-rule="evenodd"
                  d="M9.78 12.78a.75.75 0 01-1.06 0L4.47 8.53a.75.75 0 010-1.06l4.25-4.25a.75.75 0 011.06 1.06L6.06 8l3.72 3.72a.75.75 0 010 1.06z"
                ></path>
              </svg>
            </button>
            <span id="lightbox-page" aria-live="polite"></span>
            <button
              type="button"
              id="lightbox-next"
              aria-label="Next page"
              title="Next page"
            >
              <svg
                aria-hidden="true"
                viewBox="0 0 16 16"
                width="16"
                height="16"
              >
                <path
                  fill-rule="evenodd"
                  d="M6.22 3.22a.75.75 0 011.06 0l4.25 4.25a.75.75 0 010 1.06l-4.25 4.25a.75.75 0 01-1.06-1.06L9.94 8 6.22 4.28a.75.75 0 010-1.06z"
                ></path>
              </svg>
            </button>
          </div>
          <a
            id="lightbox-pdf"
            class="lightbox-link"
            href="#"
            target="_blank"
            rel="noopener"
            hidden
            >Open PDF</a
          >
          <button
            type="button"
            id="lightbox-close"
            class="lightbox-close"
            aria-label="Close"
          >
            &times;
          </button>
        </div>
        <div class="lightbox-body">
          <div id="lightbox-stage" class="lightbox-stage">
            <img id="lightbox-base" alt="" />
            <img id="lightbox-overlay" alt="" hidden />
            <div id="lightbox-divider" class="lightbox-divider" hidden></div>
          </div>
        </div>
        <div id="lightbox-footer" class="lightbox-footer" hidden>
          <span>Expected</span>
          <input
            id="lightbox-range"
            type="range"
            min="0"
            max="100"
            value="50"
            aria-label="Blend between expected and actual"
          />
          <span>Actual</span>
          <span class="lightbox-hint">
            <span><kbd>&larr;</kbd><kbd>&rarr;</kbd> switch view</span>
            <span><kbd>Esc</kbd> close</span>
          </span>
        </div>
      </dialog>
    </div>
    <script>
      $script;
    </script>
  </body>
</html>
